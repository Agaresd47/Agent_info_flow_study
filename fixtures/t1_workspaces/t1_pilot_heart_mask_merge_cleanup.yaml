fixture_version: 1
task_id: t1_pilot_heart_mask_merge_cleanup
mode: read_only_workspace
description: "Compact heart and mask trees for post-clarification merge inspection."

roots:
  - path: "/data/project/segmentation/heart"
    kind: directory
  - path: "/data/project/segmentation/mask"
    kind: directory

entries:
  - path: "/data/project/segmentation/heart/p001/heart.nii.gz"
    kind: file
  - path: "/data/project/segmentation/heart/p001/aorta.nii.gz"
    kind: file
  - path: "/data/project/segmentation/heart/p002/heart.nii.gz"
    kind: file
  - path: "/data/project/segmentation/heart/p003/heart.nii.gz"
    kind: file
  - path: "/data/project/segmentation/mask/p001/heart.nii.gz"
    kind: file
  - path: "/data/project/segmentation/mask/p002/heart.nii.gz"
    kind: file
  - path: "/data/project/segmentation/mask/p002/aorta_long.nii.gz"
    kind: file

inspection_hints:
  summarize_directory:
    "/data/project/segmentation/heart":
      patient_folders:
        - "p001"
        - "p002"
        - "p003"
    "/data/project/segmentation/mask":
      patient_folders:
        - "p001"
        - "p002"
  count_matched_files:
    unmatched_heart_only_folders:
      - "p003"
    rename_candidates_if_exact_rule_is_allowed:
      - "/data/project/segmentation/heart/p001/aorta.nii.gz -> /data/project/segmentation/mask/p001/aorta_long.nii.gz"
  detect_conflicts:
    conflicting_target_paths:
      - "/data/project/segmentation/mask/p001/heart.nii.gz"
      - "/data/project/segmentation/mask/p002/heart.nii.gz"
