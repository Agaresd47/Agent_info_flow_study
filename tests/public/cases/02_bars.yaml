pipeline:
  steps:
    - id: trigger
      kind: trigger.manual
      config:
        universe: ["sh.600000", "sz.000001"]
      next: [bars]
    - id: bars
      kind: data.market_bars
      config:
        symbols: "$trigger['universe']"
        lookback_days: 2
expected:
  bars:
    sh.600000: "*"
    sz.000001: "*"
