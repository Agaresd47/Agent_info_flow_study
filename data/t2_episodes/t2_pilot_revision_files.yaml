episode_id: t2_pilot_revision_files
project_id: eval_scaffold
context_type: planner_revision

planner_input:
  request_text: "Prepare a pilot run with T1 and T2 sample data and document how the configs map to providers."
  design_summary: "Phase 1 should cover three T1 tasks, two T2 episodes, two models for T1, and mock-first execution."
  repo_summary:
    modules:
      - "configs/"
      - "data/"
      - "rubrics/"
      - "taxonomy/"
      - "codex/"
    notes:
      - "Document pilot matrix and open gaps."
      - "Keep the worker in fresh context for v2."
  file_index:
    - codex/README.md
    - codex/next_steps.md
    - codex/need_to_address.md
    - rubrics/t1_rubric.md
    - rubrics/t2_worker_rubric.md
    - rubrics/t2_planner_rubric.md
    - taxonomy/t1_taxonomy.md
    - taxonomy/t2_taxonomy.md

gold_task_goal: "Revise the planner spec so the worker can identify exact files, constraints, and remaining gaps."
gold_constraints:
  - "List the files to touch."
  - "Capture fresh-context requirement for worker v2."
  - "Do not claim files outside the provided index."
gold_relevant_files:
  - codex/README.md
  - codex/next_steps.md
  - codex/need_to_address.md

worker_prompt_template_version: v1_structured_interpretation
worker_expected_fields:
  - understood_goal
  - constraints_to_follow
  - information_still_missing
  - first_3_concrete_actions
