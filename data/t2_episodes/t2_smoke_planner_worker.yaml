episode_id: t2_smoke_planner_worker
project_id: eval_scaffold
context_type: repo_patch_request

planner_input:
  request_text: "Add a smoke-test CLI runner that can execute one T1 case and one T2 episode."
  design_summary: "The repo is building an eval scaffold for ambiguous coding tasks and planner-worker handoff quality."
  repo_summary:
    modules:
      - "configs/"
      - "data/"
      - "scripts/"
      - "codex/"
    notes:
      - "Runner should support mock mode first."
      - "Do not require a real API key for smoke."
  file_index:
    - configs/models.yaml
    - configs/judges.yaml
    - data/t1_tasks/t1_smoke_cleanup_archive.yaml
    - data/t2_episodes/t2_smoke_planner_worker.yaml
    - scripts/eval_runner.py

gold_task_goal: "Create a CLI runner that can load a single T1 task or T2 episode and emit a run record."
gold_constraints:
  - "Prefer mock mode."
  - "Keep env/provider handling injectable."
  - "Do not depend on real API keys for smoke."
gold_relevant_files:
  - scripts/eval_runner.py
  - configs/models.yaml
  - configs/judges.yaml

worker_prompt_template_version: v1_structured_interpretation
worker_expected_fields:
  - understood_goal
  - constraints_to_follow
  - information_still_missing
  - first_3_concrete_actions
