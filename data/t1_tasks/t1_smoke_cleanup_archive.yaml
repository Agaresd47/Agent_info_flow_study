    description: "Define what counts as old."
  - slot_name: archive_destination
    importance: high
    description: "Confirm the destination path for archive."

gold_clarification_points:
  - "Ask what qualifies a file as old."
  - "Ask where archive should be created or which existing folder should be used."

user_reply_if_asked:
